<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Buku Hutang Darfin Logo</title>
  
  <!-- Outer Rounded Shield / Ledger Container (Gojek Green #00AA13) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#00AA13"/>

  <!-- Crisp White Notebook Shape -->
  <rect x="136" y="112" width="240" height="288" rx="28" fill="#FFFFFF"/>

  <!-- Left Spine Bar -->
  <path d="M 136 140 Q 136 112 164 112 L 180 112 L 180 400 L 164 400 Q 136 400 136 372 Z" fill="#E2F5E5"/>

  <!-- Bookmark Ribbon (Golden Accent) -->
  <polygon points="304,112 336,112 336,188 320,172 304,188" fill="#FFAA00"/>

  <!-- Central Emblem: Rupiah Coin in Gojek Green -->
  <circle cx="256" cy="256" r="56" fill="#00AA13"/>
  
  <!-- White Rp Glyph Outline -->
  <path d="M 238 232 L 238 280 M 238 232 L 254 232 C 263 232 268 237 268 244 C 268 251 263 256 254 256 L 238 256 M 252 256 L 268 280" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Minimalist Ledger Accent Lines -->
  <line x1="208" y1="344" x2="304" y2="344" stroke="#00AA13" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="208" y1="368" x2="264" y2="368" stroke="#00AA13" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
</svg>
