<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <title>Buku Hutang App Icon</title>
  <!-- Background with 3-tone facet depth -->
  <rect width="108" height="108" fill="#0A5C24"/>
  <path d="M0,0 L108,0 L0,108 Z" fill="#0E7B31" opacity="0.6"/>
  <path d="M0,108 L108,0 L108,108 Z" fill="#043816" opacity="0.6"/>

  <!-- Ledger Drop Shadow -->
  <rect x="25" y="24" width="58" height="64" rx="8" fill="#021C0A" opacity="0.4"/>

  <!-- Ledger Hardcover Base / Dark Spine (Left) -->
  <path d="M26,22 h14 v64 h-14 a6,6 0 0 1 -6,-6 v-52 a6,6 0 0 1 6,-6 z" fill="#043212"/>
  
  <!-- Spine Stitching notches -->
  <rect x="24" y="34" width="4" height="2" rx="1" fill="#0A5C24"/>
  <rect x="24" y="53" width="4" height="2" rx="1" fill="#0A5C24"/>
  <rect x="24" y="72" width="4" height="2" rx="1" fill="#0A5C24"/>

  <!-- Ledger Pages / Front Cover (Crisp White) -->
  <path d="M35,22 h41 a6,6 0 0 1 6,6 v52 a6,6 0 0 1 -6,6 h-41 z" fill="#FFFFFF"/>

  <!-- Golden Bookmark Ribbon Hanging from Top -->
  <path d="M63,22 h10 v22 l-5,-4 l-5,4 z" fill="#FF9800"/>
  <path d="M63,22 h10 v3 h-10 z" fill="#E65100" opacity="0.3"/>

  <!-- Ledger Account Entry Lines -->
  <rect x="40" y="32" width="18" height="3" rx="1.5" fill="#C8E6C9"/>
  <rect x="40" y="38" width="13" height="3" rx="1.5" fill="#C8E6C9"/>

  <!-- Golden Financial Coin / Seal -->
  <!-- Outer Gold -->
  <circle cx="58" cy="59" r="16" fill="#FFA000"/>
  <!-- Inner Gold Disc -->
  <circle cx="58" cy="59" r="14" fill="#FFC107"/>
  <!-- Inner Ring Stroke -->
  <circle cx="58" cy="59" r="12" fill="none" stroke="#FFE082" stroke-width="1"/>

  <!-- Bold Rp Monogram on Coin -->
  <!-- Letter R -->
  <path d="M50,52 h4.5 a3.5,3.5 0 0 1 3.5,3.5 a3.5,3.5 0 0 1 -3.5,3.5 h-2.5 v5 h-2 z M52,54 v3 h2.5 a1.5,1.5 0 0 0 1.5,-1.5 a1.5,1.5 0 0 0 -1.5,-1.5 z" fill="#004D1A"/>
  <path d="M54.5,59 l3.5,5 h-2.2 l-2.8,-4.5 z" fill="#004D1A"/>

  <!-- Letter p -->
  <path d="M60,55.5 h2 v1.2 a3,3 0 0 1 2.5,-1.2 a3,3 0 0 1 3,3 a3,3 0 0 1 -3,3 a3,3 0 0 1 -2.5,-1.2 v3.7 h-2 z M62,58.5 a1.6,1.6 0 0 0 1.6,1.6 a1.6,1.6 0 0 0 1.6,-1.6 a1.6,1.6 0 0 0 -1.6,-1.6 a1.6,1.6 0 0 0 -1.6,1.6 z" fill="#004D1A"/>

  <!-- Bottom Accent / Ledger Balance Line -->
  <rect x="40" y="74" width="34" height="2.5" rx="1.25" fill="#E0E0E0"/>
</svg>
